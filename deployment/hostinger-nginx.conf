# ==============================================================================
# Hostinger VPS Nginx Configuration for SmartDriving
# Place this file in: /etc/nginx/sites-available/smartdriving
# And link it: sudo ln -s /etc/nginx/sites-available/smartdriving /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your domain or VPS IP

    # 1. Frontend: Serve compiled React (Vite) Single Page Application
    root /var/www/smartdriving/frontend/dist;
    index index.html;

    # Gzip Compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Frontend Assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 2. Backend Laravel API Routing (/api and /sanctum)
    location ^~ /api {
        alias /var/www/smartdriving/backend/public;
        try_files $uri $uri/ @laravel_api;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/smartdriving/backend/public/index.php;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Adjust PHP version if using php8.3-fpm
            fastcgi_index index.php;
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
        }
    }

    location @laravel_api {
        rewrite ^/api/(.*)$ /var/www/smartdriving/backend/public/index.php last;
    }

    # 3. Public uploads and storage from Laravel
    location ^~ /storage {
        alias /var/www/smartdriving/backend/storage/app/public;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # 4. React SPA HTML5 History fallback (Handles React Router routes: /admin, /dashboard, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log /var/log/nginx/smartdriving_error.log;
    access_log /var/log/nginx/smartdriving_access.log;
}

